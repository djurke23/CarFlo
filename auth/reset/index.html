<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>carFlo — Reset Password / Reset lozinke</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32x32.png">
    <link rel="icon" type="image/png" href="../../favicon.png">
    <link rel="shortcut icon" href="../../favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png">
    <style>
        body {
            background-color: #0d0e0f;
            color: #e8e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 12px;
            font-weight: 700;
        }
        p {
            font-size: 15px;
            color: #9ca3af;
            margin-bottom: 8px;
            max-width: 420px;
            line-height: 1.45;
        }
        #fallback {
            display: none;
            background-color: #2ab8c8;
            color: #0d0e0f;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            margin-top: 16px;
            transition: opacity 0.2s;
        }
        #fallback:active {
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <h1>🔑 Reset Password / Reset lozinke</h1>
    <p>Opening carFlo to set your new password...</p>
    <p style="font-size: 13.5px; color: #6b7280;">Otvaram carFlo da postaviš novu lozinku...</p>
    <a id="fallback" href="#">Open carFlo / Otvori aplikaciju</a>

    <script>
        const params = window.location.search + window.location.hash;
        const deepLink = "carflo://auth/reset" + params;
        
        const fallbackBtn = document.getElementById('fallback');
        fallbackBtn.href = deepLink;

        setTimeout(() => {
            window.location.href = deepLink;
        }, 500);

        setTimeout(() => {
            fallbackBtn.style.display = 'inline-block';
        }, 2000);
    </script>
</body>
</html>
